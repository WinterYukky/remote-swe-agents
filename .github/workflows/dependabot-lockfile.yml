# Automatically regenerates lockfiles when Dependabot bumps dependencies
# in this npm-workspaces monorepo.
#
# Why this is needed:
# Dependabot updates individual workspace package.json files but does not
# always regenerate the root lockfile correctly in npm workspaces monorepos,
# causing CI failures due to lockfile-package.json mismatches.
#
# Scope:
# - Root package-lock.json: covers all workspaces under packages/*
# - cdk/package-lock.json: cdk/ is a standalone project with its own lockfile
#   (not part of the root npm workspaces). Regenerated unconditionally since
#   the operation is idempotent when cdk/package.json is unchanged.
#
# Security model:
# - Uses pull_request_target to obtain write permissions (dependabot PRs
#   receive a read-only GITHUB_TOKEN on the regular pull_request event).
# - Restricted to github.actor == 'dependabot[bot]' AND same-repository
#   check (head.repo.full_name == repository). This means:
#   - Only dependabot can trigger the workflow (actor gate)
#   - Only same-repo branches are processed (no fork-based attack vector)
#   - To abuse this workflow, an attacker would already need write access to
#     the repository — no privilege escalation is possible.
# - Checkout uses the exact HEAD SHA (not branch ref) to prevent TOCTOU
#   race conditions.
# - npm install uses --ignore-scripts as defense-in-depth to prevent
#   execution of any lifecycle scripts (e.g. git dependency prepare scripts).
#
# CI trigger behavior:
# - If LOCKFILE_FIX_TOKEN secret is configured (PAT or GitHub App token with
#   contents:write), the push uses that token and WILL trigger CI workflows.
# - If the secret is not set, falls back to GITHUB_TOKEN — the lockfile is
#   still fixed but CI won't re-run automatically (GitHub's recursive workflow
#   prevention). Maintainers should configure the secret for full functionality.
#
# Infinite loop prevention:
# - The paths filter only matches **/package.json changes.
# - The commit is pushed by a non-dependabot actor (github-actions[bot] or the
#   PAT/App identity), so the actor gate (dependabot[bot]) blocks re-trigger.

name: Dependabot Lockfile Fix

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "**/package.json"

permissions:
  contents: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR HEAD (pinned to SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.LOCKFILE_FIX_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate cdk lockfile
        run: npm install --package-lock-only --ignore-scripts
        working-directory: ./cdk

      - name: Check for lockfile changes
        id: diff
        run: |
          if git diff --exit-code package-lock.json cdk/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated lockfiles
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json cdk/package-lock.json
          git commit -m "chore: regenerate lockfiles for workspace consistency"
          git push origin "HEAD:refs/heads/${PR_HEAD_REF}"
