# Automatically regenerates lockfiles when Dependabot bumps dependencies
# in this npm-workspaces monorepo.
#
# Why this is needed:
# Dependabot updates individual workspace package.json files but does not
# always regenerate the root lockfile correctly in npm workspaces monorepos,
# causing CI failures due to lockfile-package.json mismatches.
#
# Scope:
# - Root package-lock.json: covers all workspaces under packages/*
# - cdk/package-lock.json: cdk/ is a standalone project with its own lockfile
#   (not part of the root npm workspaces). Regenerated unconditionally since
#   the operation is idempotent when cdk/package.json is unchanged.
#
# Security model:
# - Uses pull_request_target to obtain write permissions (dependabot PRs
#   receive a read-only GITHUB_TOKEN on the regular pull_request event).
# - Restricted to github.actor == 'dependabot[bot]' AND same-repository
#   check (head.repo.full_name == repository). This means:
#   - Only dependabot can trigger the workflow (actor gate)
#   - Only same-repo branches are processed (no fork-based attack vector)
#   - To abuse this workflow, an attacker would already need write access to
#     the repository — no privilege escalation is possible.
# - Checkout uses the exact HEAD SHA (not branch ref) to prevent TOCTOU
#   race conditions.
# - npm install uses --ignore-scripts as defense-in-depth to prevent
#   execution of any lifecycle scripts (e.g. git dependency prepare scripts).
#
# CI trigger behavior (PAT-free design):
# - All operations use the built-in GITHUB_TOKEN — no PAT or GitHub App
#   token is required.
# - After pushing the lockfile fix, this workflow triggers the Build CI via
#   workflow_dispatch on the PR head branch. Per GitHub's documented exception,
#   workflow_dispatch events fired by GITHUB_TOKEN DO create new workflow runs
#   (unlike push/pull_request events which are suppressed to prevent recursion).
# - The dispatched Build workflow (build.yml) uses dorny/paths-filter which
#   compares the PR branch against the default branch, correctly identifying
#   all changed paths for conditional job execution.
#
# Infinite loop prevention:
# - The paths filter only matches **/package.json changes.
# - The lockfile commit is pushed by github-actions[bot] via GITHUB_TOKEN,
#   so push-triggered workflows are suppressed (GitHub's standard recursion
#   prevention for GITHUB_TOKEN pushes).
# - The explicitly dispatched workflow_dispatch targets build.yml (not this
#   workflow), so no re-trigger of dependabot-lockfile.yml occurs.
# - The actor gate (dependabot[bot]) would block re-trigger regardless,
#   since the push actor is github-actions[bot].

name: Dependabot Lockfile Fix

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "**/package.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR HEAD (pinned to SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Regenerate root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate cdk lockfile
        run: npm install --package-lock-only --ignore-scripts
        working-directory: ./cdk

      - name: Check for lockfile changes
        id: diff
        run: |
          if git diff --exit-code package-lock.json cdk/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated lockfiles
        if: steps.diff.outputs.changed == 'true'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json cdk/package-lock.json
          git commit -m "chore: regenerate lockfiles for workspace consistency"
          git push origin "HEAD:refs/heads/${PR_HEAD_REF}"

      - name: Trigger CI via workflow_dispatch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -f "ref=${PR_HEAD_REF}"
